<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!--
    应用内图标（登录页 / 我的页）  v2
    圆角矩形蓝渐变底 + 右上玻璃高光 + 四象限十字（半透白 30%）+ 纯白势线
    几何为 288 前景层按 120/288 等比换算，终点内收保持一致
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="55%" stop-color="#007DFF"/>
      <stop offset="100%" stop-color="#004FC7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bg)"/>
  <path d="M96 34V6h24v28z" fill="url(#glass)" opacity="0.7"/>
  <!-- 辅助层：四象限十字（半透白 30%，线宽 1.46 ≈ 势线 1/10） -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.46">
    <line x1="21" y1="60" x2="99" y2="60"/>
    <line x1="60" y1="21" x2="60" y2="99"/>
  </g>
  <!-- 主层：三段式上扬势线（纯白 100%），末段最长且收于最高点 -->
  <path d="M27.5 85.8L45.4 60L60 75.8L88.3 37.5" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
