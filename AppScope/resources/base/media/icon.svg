<svg xmlns="http://www.w3.org/2000/svg" width="288" height="288" viewBox="0 0 288 288">
  <!--
    分层图标 · 前景层（桌面图标 + 最近任务）  v2
    层级：势线（纯白 100%）为主 >> 四象限十字（半透白 30%）为辅，二者不抢权重
    安全区：中央 66%（x/y ∈ 49~239）；前景层会被系统裁切，墨迹不得越界
    v2 变更：去掉网格外框——四象限度靠十字分区即可，减少 48px 下的笔画糊化
  -->
  <!-- 辅助层：2×2 四象限十字（正交、不倾斜、不错位），线宽 3.5 ≈ 势线 1/10 -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="3.5">
    <line x1="50.5" y1="144" x2="237.5" y2="144"/>
    <line x1="144" y1="50.5" x2="144" y2="237.5"/>
  </g>
  <!-- 主层：三段式上扬势线（起手 → 首峰 → 微蓄 → 长段上扬）
       末段最长（≈114）且收于最高点；峰谷间距（≥51）均大于线宽（36），小尺寸不粘连
       终点内收至 (212,90)，右上留出 ~9px 呼吸，避免撞安全区右沿 -->
  <path d="M66 206L109 144L144 182L212 90" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
